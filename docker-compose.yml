services:
  api:
    build: .
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_RABBITMQ_HOST: rabbitmq
      PRONOSTICO_URL: http://pronostico:9001
      COMPRAS_URL: http://compras:9002
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      pronostico: { condition: service_started }
      compras: { condition: service_started }

  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    env_file: .env
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  pronostico:
    image: python:3.12-slim
    volumes: ["./mocks:/app:ro"]
    command: ["python", "/app/app.py"]
    environment: { MODE: pronostico, PORT: "9001" }

  compras:
    image: python:3.12-slim
    volumes: ["./mocks:/app:ro"]
    command: ["python", "/app/app.py"]
    environment: { MODE: compras, PORT: "9002" }

volumes:
  pgdata:
